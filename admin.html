<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإشراف | ELGANT ROSE</title>
    <!-- استدعاء الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-rose: #c48b9f;
            --primary-dark: #8c5365;
            --bg-rose-light: #fbf7f6;
            --text-dark: #2b1b20;
            --text-muted: #736267;
            --border-color: #eededc;
            --card-bg: #ffffff;
            --shadow: 0 5px 20px rgba(0,0,0,0.03);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alexandria', sans-serif;
            background-color: var(--bg-rose-light);
            color: var(--text-dark);
            direction: rtl;
        }

        header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-box img {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-rose);
        }

        .logo-title h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 22px;
            color: var(--text-dark);
            margin: 0;
            line-height: 1;
        }

        .logo-title span {
            font-size: 11px;
            color: var(--primary-dark);
            font-weight: 600;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* شاشة تسجيل الدخول */
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            max-width: 400px;
            margin: 60px auto;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-card h2 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 28px;
            color: var(--primary-dark);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Alexandria', sans-serif;
            background: #fff;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-rose) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Alexandria', sans-serif;
            transition: var(--transition);
        }

        .btn-submit:hover { opacity: 0.92; }

        /* لوحة التحكم الرئيسية */
        .admin-dashboard { display: none; }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .card h3 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-dark);
        }

        .product-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f7eded;
        }

        .btn-delete {
            background: #d9534f;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Alexandria', sans-serif;
        }

        .logout-btn {
            background: none;
            border: 1px solid #d9534f;
            color: #d9534f;
            padding: 6px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Alexandria', sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-box">
            <img src="https://raw.githubusercontent.com/elegaantrose/shop/main/logo.jpg" alt="Logo">
            <div class="logo-title">
                <h1>ELGANT ROSE</h1>
                <span>لوحة الإشراف</span>
            </div>
        </a>
        <button id="logout-btn" class="logout-btn" style="display: none;" onclick="logout()">تسجيل الخروج</button>
    </header>

    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-section" class="login-card">
            <h2>تسجيل دخول المدير</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم:</label>
                    <input type="text" id="username" placeholder="admin1" required>
                </div>
                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" id="password" placeholder="1986" required>
                </div>
                <button type="submit" class="btn-submit">دخول لوحة التحكم</button>
            </form>
        </div>

        <!-- لوحة التحكم المحمية -->
        <div id="dashboard-section" class="admin-dashboard">
            <div class="card">
                <h3>إضافة قطعة ملابس جديدة (مع 5 صور درايف)</h3>
                <form onsubmit="addProduct(event)">
                    <div class="form-group">
                        <label>اسم القطعة:</label>
                        <input type="text" id="p-name" placeholder="مثال: فستان سهرة مخملي راقي" required>
                    </div>

                    <div class="form-group">
                        <label>السعر (بالدينار الأردني د.أ):</label>
                        <input type="number" step="0.01" id="p-price" placeholder="مثال: 35.00" required>
                    </div>

                    <div class="form-group">
                        <label>نسبة الخصم أو العرض (اختياري):</label>
                        <input type="text" id="p-discount" placeholder="مثال: خصم 20% أو عرض خاص">
                    </div>

                    <div class="form-group">
                        <label>تصنيف القطعة:</label>
                        <select id="p-category">
                            <option value="فساتين">فساتين</option>
                            <option value="بلوزات">بلوزات</option>
                            <option value="عبايات">عبايات</option>
                            <option value="إكسسوارات">إكسسوارات</option>
                        </select>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

                    <div class="form-group">
                        <label><strong>1. رابط أو معرف الصورة الرئيسية الكبيرة (Google Drive):</strong></label>
                        <input type="text" id="img-main" placeholder="ضع رابط صورة Google Drive الرئيسية" required>
                    </div>

                    <div class="form-group">
                        <label>2. رابط الصورة التفصيلية الأولى (مربع صغير):</label>
                        <input type="text" id="img-sub1" placeholder="رابط درايف صورة 2">
                    </div>

                    <div class="form-group">
                        <label>3. رابط الصورة التفصيلية الثانية (مربع صغير):</label>
                        <input type="text" id="img-sub2" placeholder="رابط درايف صورة 3">
                    </div>

                    <div class="form-group">
                        <label>4. رابط الصورة التفصيلية الثالثة (مربع صغير):</label>
                        <input type="text" id="img-sub3" placeholder="رابط درايف صورة 4">
                    </div>

                    <div class="form-group">
                        <label>5. رابط الصورة التفصيلية الرابعة (مربع صغير):</label>
                        <input type="text" id="img-sub4" placeholder="رابط درايف صورة 5">
                    </div>

                    <button type="submit" class="btn-submit" style="margin-top: 10px;">نشر القطعة بالمتجر</button>
                </form>
            </div>

            <div class="card">
                <h3>القطع المعروضة حالياً في المتجر</h3>
                <div id="admin-products-list"></div>
            </div>
        </div>
    </div>

    <script>
        function checkAuth() {
            const auth = sessionStorage.getItem('elgant_admin_logged');
            if (auth === 'true') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('logout-btn').style.display = 'block';
                loadAdminProducts();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === 'admin1' && p === '1986') {
                sessionStorage.setItem('elgant_admin_logged', 'true');
                checkAuth();
            } else {
                alert('اسم المستخدم أو كلمة السر غير صحيحة!');
            }
        }

        function logout() {
            sessionStorage.removeItem('elgant_admin_logged');
            checkAuth();
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const discount = document.getElementById('p-discount').value;
            const category = document.getElementById('p-category').value;
            
            const images = [
                document.getElementById('img-main').value,
                document.getElementById('img-sub1').value,
                document.getElementById('img-sub2').value,
                document.getElementById('img-sub3').value,
                document.getElementById('img-sub4').value
            ].filter(img => img.trim() !== '');

            let products = JSON.parse(localStorage.getItem('elgant_products')) || [];
            products.push({ name, price, discount, category, images });
            localStorage.setItem('elgant_products', JSON.stringify(products));

            alert('تم نشر القطعة بنجاح في المتجر!');
            e.target.reset();
            loadAdminProducts();
        }

        function loadAdminProducts() {
            const listContainer = document.getElementById('admin-products-list');
            let products = JSON.parse(localStorage.getItem('elgant_products')) || [];

            if (products.length === 0) {
                listContainer.innerHTML = '<p style="color: #777; text-align: center; padding: 15px;">لا توجد قطع مضافة بعد.</p>';
                return;
            }

            listContainer.innerHTML = '';
            products.forEach((product, index) => {
                listContainer.innerHTML += `
                    <div class="product-list-item">
                        <span><strong>${product.name}</strong> - <span style="color: var(--primary-dark); font-weight: bold;">${product.price} د.أ</span> (${product.category})</span>
                        <button class="btn-delete" onclick="deleteProduct(${index})">حذف القطعة</button>
                    </div>
                `;
            });
        }

        function deleteProduct(index) {
            if (confirm('هل أنت متأكد من حذف هذه القطعة من المتجر؟')) {
                let products = JSON.parse(localStorage.getItem('elgant_products')) || [];
                products.splice(index, 1);
                localStorage.setItem('elgant_products', JSON.stringify(products));
                loadAdminProducts();
            }
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
