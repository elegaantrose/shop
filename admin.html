<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإشراف | ELGANT ROSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary-rose: #c48b9f; --primary-dark: #8c5365; --bg: #fbf7f6; }
        body { font-family: 'Alexandria', sans-serif; background: var(--bg); color: #2b1b20; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { font-family: 'Aref Ruqaa', serif; color: var(--primary-dark); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #eededc; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary-dark); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .card { background: #fdf5f7; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>لوحة التحكم المتصلة بقاعدة بيانات MongoDB</h2>
        
        <!-- قسم إضافة منتج ورفع الصور مباشرة من الجهاز -->
        <div class="card">
            <h3>إضافة قطعة محجبات جديدة (مع رفع الصور لمونجو)</h3>
            <form onsubmit="addNewProduct(event)">
                <div class="form-group"><label>اسم القطعة:</label><input type="text" id="p-name" required></div>
                <div class="form-group"><label>السعر (د.أ):</label><input type="number" step="0.01" id="p-price" required></div>
                <div class="form-group"><label>الكمية المتوفرة:</label><input type="number" id="p-stock" value="10" required></div>
                <div class="form-group"><label>الخصم:</label><input type="text" id="p-discount" placeholder="مثال: خصم 20%"></div>
                <div class="form-group">
                    <label>اختر الصور من جهازك (سيتم حفظها مباشرة في MongoDB):</label>
                    <input type="file" id="p-images" multiple accept="image/*" required>
                </div>
                <button type="submit">رفع وحفظ في MongoDB</button>
            </form>
        </div>

        <!-- قسم تقارير المخزون والمبيعات -->
        <div class="card">
            <h3>تقرير المخزون والمبيعات (من MongoDB)</h3>
            <div id="stock-report">جاري التحميل...</div>
        </div>

        <!-- قسم طلبات المشترين -->
        <div class="card">
            <h3>طلبات المشترين والفواتير</h3>
            <div id="orders-list">جاري التحميل...</div>
        </div>
    </div>

    <script src="store.js"></script>
    <script>
        // تحويل الصور المرفوعة من الجهاز إلى Base64 لحفظها مباشرة في قاعدة مونجو
        function convertFilesToBase64(files) {
            return Promise.all(Array.from(files).map(file => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(file);
                });
            }));
        }

        async function addNewProduct(e) {
            e.preventDefault();
            const filesInput = document.getElementById('p-images');
            const base64Images = await convertFilesToBase64(filesInput.files);

            const productData = {
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value),
                discount: document.getElementById('p-discount').value,
                images: base64Images
            };

            const res = await ApiService.addProduct(productData);
            if(res.success) {
                alert('تم رفع المنتج وصوره وحفظها بنجاح في MongoDB!');
                location.reload();
            }
        }

        async function loadAdminData() {
            const products = await ApiService.getProducts();
            const orders = await ApiService.getOrders();

            // عرض تقرير المخزون
            let stockHtml = '';
            products.forEach(p => {
                stockHtml += `<div><strong>${p.name}</strong> - السعر: ${p.price} د.أ - المخزون: <b>${p.stock}</b> - المباع: <b>${p.soldCount || 0}</b> <button onclick="deleteProd('${p._id}')" style="background:#d9534f; padding:3px 8px; font-size:11px;">حذف</button></div><hr>`;
            });
            document.getElementById('stock-report').innerHTML = stockHtml || 'لا توجد منتجات.';

            // عرض الطلبات
            let orderHtml = '';
            orders.forEach(o => {
                orderHtml += `<div style="background:#fff; padding:10px; margin-top:5px; border-radius:5px;">
                    فاتورة: <b>${o.invoiceId}</b> | الزبون: ${o.customer.name} (${o.customer.phone}) | الحالة: ${o.status}
                    <br>المجموع: ${o.total} د.أ 
                    ${o.status !== 'تم التأكيد وإصدار الفاتورة' ? `<button onclick="confirmOrd('${o._id}', '${o.invoiceId}')">تأكيد وتصدير فاتورة PDF</button>` : ''}
                </div>`;
            });
            document.getElementById('orders-list').innerHTML = orderHtml || 'لا توجد طلبات.';
        }

        async function deleteProd(id) {
            if(confirm('هل أنت متأكد من الحذف من قاعدة بيانات مونجو؟')) {
                await ApiService.deleteProduct(id);
                loadAdminData();
            }
        }

        async function confirmOrd(id, invoiceId) {
            await ApiService.confirmOrder(id);
            alert('تم تأكيد الطلب بنجاح من قاعدة البيانات!');
            loadAdminData();
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
