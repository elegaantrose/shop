<div class="card">
    <h3>إضافة قطعة محجبات جديدة (رفع حتى 5 صور مباشرة)</h3>
    <form onsubmit="addNewProduct(event)">
        <div class="form-group"><label>اسم القطعة:</label><input type="text" id="p-name" required></div>
        <div class="form-group"><label>السعر (د.أ):</label><input type="number" step="0.01" id="p-price" required></div>
        <div class="form-group"><label>الكمية المتوفرة:</label><input type="number" id="p-stock" value="10" required></div>
        <div class="form-group"><label>الخصم (اختياري):</label><input type="text" id="p-discount" placeholder="مثال: خصم 20%"></div>
        <div class="form-group">
            <label>اختر الصور (<strong>حد أقصى 5 صور</strong>):</label>
            <input type="file" id="p-images" multiple accept="image/*" required onchange="validateImageCount(this)">
            <small style="color: #736267;">الصورة الأولى ستكون رئيسية، والباقي صوراً مصغرة تفصيلية.</small>
        </div>
        <button type="submit">حفظ ورفع على قاعدة بيانات MongoDB</button>
    </form>
</div>

<script>
    // التحقق من عدم تجاوز 5 صور
    function validateImageCount(input) {
        if (input.files.length > 5) {
            alert('عذراً، الحد الأقصى المسموح به هو 5 صور فقط!');
            input.value = ''; // إعادة تعيين الحقل
        }
    }

    function convertFilesToBase64(files) {
        return Promise.all(Array.from(files).map(file => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }));
    }

    async function addNewProduct(e) {
        e.preventDefault();
        const filesInput = document.getElementById('p-images');
        
        if (filesInput.files.length === 0 || filesInput.files.length > 5) {
            alert('الرجاء اختيار بين 1 إلى 5 صور كحد أقصى.');
            return;
        }

        const base64Images = await convertFilesToBase64(filesInput.files);

        const productData = {
            name: document.getElementById('p-name').value,
            price: parseFloat(document.getElementById('p-price').value),
            stock: parseInt(document.getElementById('p-stock').value),
            discount: document.getElementById('p-discount').value,
            images: base64Images
        };

        const res = await fetch('http://localhost:3000/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(productData)
        });
        
        const data = await res.json();
        if(data.success) {
            alert('تم رفع الصور والمنتج بنجاح وحفظهما في MongoDB!');
            location.reload();
        } else {
            alert('حدث خطأ أثناء الرفع: ' + data.error);
        }
    }
</script>
