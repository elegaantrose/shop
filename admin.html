<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإشراف | ELGANT ROSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة لإنشاء ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary-rose: #c48b9f;
            --primary-dark: #8c5365;
            --bg-rose-light: #fbf7f6;
            --text-dark: #2b1b20;
            --border-color: #eededc;
        }

        body {
            font-family: 'Alexandria', sans-serif;
            background-color: var(--bg-rose-light);
            color: var(--text-dark);
            direction: rtl;
            margin: 0;
            padding: 0;
        }

        header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-dark);
        }

        .logo-box img {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary-rose);
            object-fit: cover;
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .login-card, .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .login-card { max-width: 400px; margin: 60px auto; text-align: center; }

        h2, h3 {
            font-family: 'Aref Ruqaa', serif;
            color: var(--primary-dark);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Alexandria', sans-serif;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-rose) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Alexandria', sans-serif;
        }

        .admin-dashboard { display: none; }

        .order-card, .stock-card {
            background: #fdf5f7;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .btn-action {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Alexandria', sans-serif;
            margin-top: 8px;
        }

        .logout-btn {
            background: none;
            border: 1px solid #d9534f;
            color: #d9534f;
            padding: 6px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-box">
            <img src="https://raw.githubusercontent.com/elegaantrose/shop/main/logo.jpg" alt="Logo">
            <span style="font-family: 'Aref Ruqaa', serif; font-size: 18px;">لوحة إشراف ELGANT ROSE</span>
        </a>
        <button id="logout-btn" class="logout-btn" style="display: none;" onclick="logout()">تسجيل الخروج</button>
    </header>

    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-section" class="login-card">
            <h2>تسجيل دخول المدير</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم:</label>
                    <input type="text" id="username" placeholder="admin1" required>
                </div>
                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" id="password" placeholder="1986" required>
                </div>
                <button type="submit" class="btn-submit">دخول لوحة التحكم</button>
            </form>
        </div>

        <!-- لوحة التحكم المحمية -->
        <div id="dashboard-section" class="admin-dashboard">
            
            <!-- إضافة منتج جديد -->
            <div class="card">
                <h3>إضافة قطعة ملابس جديدة والمخزون</h3>
                <form onsubmit="addProduct(event)">
                    <div class="form-group">
                        <label>اسم القطعة:</label>
                        <input type="text" id="p-name" placeholder="اسم الفستان أو القطعة" required>
                    </div>
                    <div class="form-group">
                        <label>السعر (د.أ):</label>
                        <input type="number" step="0.01" id="p-price" placeholder="35.00" required>
                    </div>
                    <div class="form-group">
                        <label>الكمية المتوفرة في المخزون:</label>
                        <input type="number" id="p-stock" value="10" required>
                    </div>
                    <div class="form-group">
                        <label>نسبة الخصم (اختياري):</label>
                        <input type="text" id="p-discount" placeholder="خصم 20%">
                    </div>
                    <div class="form-group">
                        <label>1. رابط الصورة الرئيسية الكبيرة (Google Drive):</label>
                        <input type="text" id="img-main" placeholder="رابط درايف" required>
                    </div>
                    <div class="form-group">
                        <label>2، 3، 4، 5 (روابط الصور الصغيرة المربعة مفصولة بفاصلة أو واحدة تلو الأخرى):</label>
                        <input type="text" id="img-sub" placeholder="روابط إضافية">
                    </div>
                    <button type="submit" class="btn-submit">نشر القطعة</button>
                </form>
            </div>

            <!-- تقارير المخزون والأكثر مبيعا -->
            <div class="card">
                <h3>تقارير المخزون والمبيعات والأكثر مبيعا</h3>
                <div id="stock-report-list"></div>
            </div>

            <!-- متابعة طلبات الزبائن (البحث برقم الفاتورة) -->
            <div class="card">
                <h3>طلبات الزبائن بانتظار التأكيد (بحث برقم الفاتورة)</h3>
                <div class="form-group">
                    <input type="text" id="search-invoice" placeholder="ابحث برقم الفاتورة (مثال: ROS-123456)..." onkeyup="filterOrders()">
                </div>
                <div id="orders-list"></div>
            </div>

        </div>
    </div>

    <!-- استدعاء ملف البيانات المركزي -->
    <script src="store.js"></script>
    <script>
        function checkAuth() {
            const auth = sessionStorage.getItem('elgant_admin_logged');
            if (auth === 'true') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('logout-btn').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'admin1' && p === '1986') {
                sessionStorage.setItem('elgant_admin_logged', 'true');
                checkAuth();
            } else {
                alert('خطأ في اسم المستخدم أو كلمة السر!');
            }
        }

        function logout() {
            sessionStorage.removeItem('elgant_admin_logged');
            checkAuth();
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const stock = parseInt(document.getElementById('p-stock').value) || 10;
            const discount = document.getElementById('p-discount').value;
            const imgMain = document.getElementById('img-main').value;
            const imgSub = document.getElementById('img-sub').value.split(',').map(s => s.trim());

            let products = StoreManager.getProducts();
            products.push({
                name, price, stock, discount,
                images: [imgMain, ...imgSub],
                soldCount: 0
            });
            StoreManager.saveProducts(products);
            alert('تمت إضافة المنتج بنجاح!');
            e.target.reset();
            loadAdminData();
        }

        function loadAdminData() {
            loadStockReport();
            loadOrders();
        }

        function loadStockReport() {
            const container = document.getElementById('stock-report-list');
            const products = StoreManager.getProducts();
            if (products.length === 0) {
                container.innerHTML = '<p>لا توجد منتجات مسجلة.</p>';
                return;
            }

            container.innerHTML = '';
            // ترتيب القطع حسب الأكثر مبيعا
            products.sort((a, b) => (b.soldCount || 0) - (a.soldCount || 0));

            products.forEach((p, idx) => {
                container.innerHTML += `
                    <div class="stock-card">
                        <strong>${idx + 1}. ${p.name}</strong><br>
                        - السعر: ${p.price} د.أ<br>
                        - الكمية المتبقية بالمخزون: <span style="color: green; font-weight: bold;">${p.stock !== undefined ? p.stock : 10}</span><br>
                        - القطع التي تم بيعها: <span style="color: #8c5365; font-weight: bold;">${p.soldCount || 0}</span> ${idx === 0 && (p.soldCount || 0) > 0 ? '🔥 (الأكثر مبيعا)' : ''}
                    </div>
                `;
            });
        }

        function loadOrders() {
            const container = document.getElementById('orders-list');
            const orders = StoreManager.getOrders();
            renderOrders(orders);
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-list');
            if (orders.length === 0) {
                container.innerHTML = '<p>لا توجد طلبات جديدة حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            orders.slice().reverse().forEach(order => {
                let itemsStr = order.items.map(i => `${i.name} (${i.price} د.أ)`).join(', ');
                container.innerHTML += `
                    <div class="order-card" data-invoice="${order.invoiceId}">
                        <strong>رقم الفاتورة: ${order.invoiceId}</strong> (${order.date})<br>
                        - الزبون: ${order.customer.name} | الهاتف: ${order.customer.phone}<br>
                        - العنوان: ${order.customer.address} | محفظة أورنج: ${order.customer.wallet}<br>
                        - القطع: ${itemsStr}<br>
                        - المجموع: <strong>${order.total} د.أ</strong><br>
                        - الحالة: <span style="color: blue;">${order.status}</span><br>
                        <button class="btn-action" onclick="confirmAndSendPDF('${order.invoiceId}')"><i class="fa-solid fa-file-pdf"></i> تأكيد وإرسال الفاتورة PDF للواتساب</button>
                    </div>
                `;
            });
        }

        function filterOrders() {
            const query = document.getElementById('search-invoice').value.trim().toLowerCase();
            const orders = StoreManager.getOrders();
            const filtered = orders.filter(o => o.invoiceId.toLowerCase().includes(query) || o.customer.name.toLowerCase().includes(query) || o.customer.phone.includes(query));
            renderOrders(filtered);
        }

        // إنشاء فاتورة PDF وإرسالها عبر واتساب
        function confirmAndSendPDF(invoiceId) {
            const confirmedOrder = StoreManager.confirmOrder(invoiceId);
            loadAdminData();

            // توليد PDF باستخدام jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.text("ELGANT ROSE - فاتورة الشراء", 105, 20, { align: "center" });
            doc.setFont("helvetica", "normal");
            doc.text(`Invoice ID: ${confirmedOrder.invoiceId}`, 20, 35);
            doc.text(`Date: ${confirmedOrder.date}`, 20, 45);
            doc.text(`Customer Name: ${confirmedOrder.customer.name}`, 20, 55);
            doc.text(`Phone: ${confirmedOrder.customer.phone}`, 20, 65);
            doc.text(`Address: ${confirmedOrder.customer.address}`, 20, 75);

            let y = 90;
            doc.text("Items:", 20, y);
            confirmedOrder.items.forEach((item, index) => {
                y += 10;
                doc.text(`${index + 1}. ${item.name} - ${item.price} JOD`, 25, y);
            });

            y += 20;
            doc.setFont("helvetica", "bold");
            doc.text(`Total Amount: ${confirmedOrder.total} JOD`, 20, y);

            // حفظ ملف الـ PDF محلياً
            doc.save(`Invoice_${confirmedOrder.invoiceId}.pdf`);

            // تجهيز رابط واتساب لإرسال إشعار للزبون
            const msg = `مرحباً ${confirmedOrder.customer.name}، تم تأكيد طلبك من متجر ELGANT ROSE برقم الفاتورة ${confirmedOrder.invoiceId}. المجموع الإجمالي: ${confirmedOrder.total} دينار أردني. شكراً لتسوقك معنا!`;
            const whatsappUrl = `https://wa.me/962${confirmedOrder.customer.phone.replace(/^0/, '')}?text=${encodeURIComponent(msg)}`;
            
            alert('تم تأكيد الطلب وتنزيل الفاتورة PDF بنجاح! سيتم فتح محادثة واتساب لإرسال الإشعار للزبون.');
            window.open(whatsappUrl, '_blank');
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
