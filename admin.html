<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | ELGANT ROSE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="LOGO.JPE" alt="ELGANT ROSE Logo">
            <h1>لوحة المدير - ELGANT ROSE</h1>
        </div>
        <nav>
            <a href="index.html">عرض المتجر</a>
            <a href="admin.html">لوحة التحكم</a>
        </nav>
    </header>

    <div class="container">
        <h2>إضافة قطعة ملابس جديدة</h2>
        
        <div style="background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 30px;">
            <form id="product-form" onsubmit="addProduct(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom: 5px; font-weight: bold;">اسم القطعة:</label>
                    <input type="text" id="p-name" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom: 5px; font-weight: bold;">السعر (بالدينار الأردني د.أ):</label>
                    <input type="number" step="0.01" id="p-price" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom: 5px; font-weight: bold;">رابط صورة Google Drive (أو معرف الملف):</label>
                    <input type="text" id="p-image" placeholder="مثال: https://drive.google.com/file/d/xxxx/view" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                    <small style="color: #666; display: block; margin-top: 5px;">تأكد من جعل مشاركة ملف الصورة في الدرايف: "أي شخص لديه الرابط يمكنه العرض".</small>
                </div>

                <button type="submit">إضافة المنتج للمتجر</button>
            </form>
        </div>

        <h2>المنتجات الحالية في المخزون</h2>
        <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <ul id="admin-products-list" style="list-style: none; padding: 0;">
                <!-- سيتم عرض المنتجات هنا مع زر الحذف -->
            </ul>
        </div>
    </div>

    <script>
        function addProduct(event) {
            event.preventDefault();
            
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const image = document.getElementById('p-image').value;

            const newProduct = { name, price, image };

            let products = JSON.parse(localStorage.getItem('elgant_products')) || [];
            products.push(newProduct);
            localStorage.setItem('elgant_products', JSON.stringify(products));

            alert('تمت إضافة القطعة بنجاح وربطها بالمتجر!');
            document.getElementById('product-form').reset();
            loadAdminProducts();
        }

        function loadAdminProducts() {
            const listContainer = document.getElementById('admin-products-list');
            let products = JSON.parse(localStorage.getItem('elgant_products')) || [];

            if (products.length === 0) {
                listContainer.innerHTML = '<p>لا توجد منتجات مضافة بعد.</p>';
                return;
            }

            listContainer.innerHTML = '';
            products.forEach((product, index) => {
                listContainer.innerHTML += `
                    <li style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
                        <span><strong>${product.name}</strong> - ${product.price} د.أ</span>
                        <button style="background-color: #bc6c25;" onclick="deleteProduct(${index})">حذف</button>
                    </li>
                `;
            });
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('elgant_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('elgant_products', JSON.stringify(products));
            loadAdminProducts();
        }

        window.onload = loadAdminProducts;
    </script>
</body>
</html>
