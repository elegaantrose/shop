<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - متجر الأناقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #ff6584;
            --light-pink: #fff0f3;
            --dark-pink: #e04f6d;
            --white: #ffffff;
            --gray-bg: #f8f9fa;
            --text-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--gray-bg);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* القائمة الجانبية للوحة التحكم */
        aside {
            width: 260px;
            background-color: var(--white);
            border-left: 1px solid #eee;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        aside .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-pink);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        aside nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            text-decoration: none;
            color: var(--text-color);
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        aside nav a.active, aside nav a:hover {
            background-color: var(--light-pink);
            color: var(--primary-pink);
        }

        .back-store {
            margin-top: auto;
            color: #777;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
        }
        .back-store:hover {
            color: var(--primary-pink);
        }

        /* المحتوى الرئيسي */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 26px;
            color: var(--text-color);
        }

        /* نموذج الإضافة */
        .card {
            background: var(--white);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            margin-bottom: 30px;
            border: 1px solid #eee;
        }

        .card h3 {
            margin-bottom: 20px;
            color: var(--dark-pink);
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 5px rgba(255, 101, 132, 0.2);
        }

        .btn-submit {
            background-color: var(--primary-pink);
            color: var(--white);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--dark-pink);
        }

        /* جدول المنتجات الحالية */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            border: 1px solid #eee;
        }

        th, td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--light-pink);
            color: var(--dark-pink);
            font-size: 15px;
        }

        td img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside>
        <div class="logo">
            <i class="fa-solid fa-gauge-high"></i> لوحة التحكم
        </div>
        <nav>
            <a href="#" class="active"><i class="fa-solid fa-box"></i> إدارة المنتجات</a>
        </nav>
        <a href="index.html" class="back-store"><i class="fa-solid fa-arrow-right"></i> العودة للمتجر</a>
    </aside>

    <!-- المحتوى -->
    <main>
        <div class="admin-header">
            <h1>إدارة منتجات المتجر</h1>
        </div>

        <!-- نموذج إضافة منتج -->
        <div class="card">
            <h3>إضافة منتج جديد</h3>
            <form id="addProductForm">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="productName" placeholder="أدخل اسم المنتج هنا..." required>
                </div>
                <div class="form-group">
                    <label>السعر (ر.س)</label>
                    <input type="number" id="productPrice" placeholder="أدخل السعر..." required>
                </div>
                <div class="form-group">
                    <label>رابط الصورة (URL)</label>
                    <input type="url" id="productImage" placeholder="ضع رابط صورة من الإنترنت (مثل Unsplash)..." required>
                </div>
                <button type="submit" class="btn-submit">حفظ وإضافة المنتج</button>
            </form>
        </div>

        <!-- جدول المنتجات -->
        <div class="card">
            <h3>المنتجات المعروضة حالياً</h3>
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>اسم المنتج</th>
                        <th>السعر</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="adminProductsTable">
                    <!-- سيتم تعبئتها ديناميكياً -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // جلب المنتجات وعرضها في الجدول
        function loadAdminProducts() {
            let products = JSON.parse(localStorage.getItem('store_products')) || [];
            const tableBody = document.getElementById('adminProductsTable');
            tableBody.innerHTML = '';

            if (products.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">لا توجد منتجات حالياً.</td></tr>`;
                return;
            }

            products.forEach((product, index) => {
                tableBody.innerHTML += `
                    <tr>
                        <td><img src="${product.image}" alt=""></td>
                        <td>${product.name}</td>
                        <td>${product.price} ر.س</td>
                        <td><button class="btn-delete" onclick="deleteProduct(${index})">حذف</button></td>
                    </tr>
                `;
            });
        }

        // إضافة منتج جديد
        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').value;

            let products = JSON.parse(localStorage.getItem('store_products')) || [];

            products.push({
                id: Date.now(),
                name: name,
                price: price,
                image: image
            });

            localStorage.setItem('store_products', JSON.stringify(products));

            // إعادة تعيين النموذج وتحديث الجدول
            this.reset();
            loadAdminProducts();
            alert('تمت إضافة المنتج بنجاح وتحديث المتجر!');
        });

        // حذف منتج
        function deleteProduct(index) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                let products = JSON.parse(localStorage.getItem('store_products')) || [];
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                loadAdminProducts();
            }
        }

        window.onload = loadAdminProducts;
    </script>
</body>
</html>
