            --primary-dark: #8c5365;

            --text-muted: #736267;

        img { pointer-events: none; }

        body {

            color: var(--text-dark);
            direction: rtl;
        }

        .top-banner {

            color: white;
            text-align: center;
            padding: 10px 15px;
            font-size: 13px;
        }

        header {
            background: white;

            top: 0;
            z-index: 100;

        .header-container {

            display: flex;
            justify-content: space-between;
            align-items: center;

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-box img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-rose);
        }

        .logo-title h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 26px;
            color: var(--text-dark);
            margin: 0;
        }

        .logo-title span {
            font-size: 11px;
            color: var(--primary-dark);
            font-weight: 600;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 14px;
        }

        nav a:hover { color: var(--primary-dark); }

        .cart-btn {
            position: relative;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 14px;
            color: var(--primary-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Alexandria', sans-serif;
            font-weight: 600;
        }

        .cart-badge {
            background-color: var(--primary-dark);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 10px;
        }

            background: white;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
