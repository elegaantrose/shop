<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELGANT ROSE | الوردة الأنيقة</title>
    <!-- استدعاء الخطوط المنيقة المطابقة لصفحة الإشراف -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* الألوان والخطوط المطابقة تماماً لصفحة لوحة الإشراف */
        :root {
            --primary-rose: #c48b9f;
            --primary-dark: #8c5365;
            --bg-rose-light: #fbf7f6;
            --text-dark: #2b1b20;
            --text-muted: #736267;
            --border-color: #eededc;
            --card-bg: #ffffff;
            --shadow: 0 5px 20px rgba(0,0,0,0.03);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alexandria', sans-serif;
            background-color: var(--bg-rose-light);
            color: var(--text-dark);
            direction: rtl;
        }

        /* الشريط العلوي */
        .top-banner {
            background-color: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 300;
        }

        /* الهيدر وشريط التنقل المطابق للإشراف */
        header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-box img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-rose);
        }

        .logo-title h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 26px;
            color: var(--text-dark);
            line-height: 1;
            margin: 0;
        }

        .logo-title span {
            font-size: 11px;
            color: var(--primary-dark);
            font-weight: 600;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--primary-dark);
        }

        .cart-btn {
            position: relative;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 14px;
            color: var(--primary-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Alexandria', sans-serif;
            font-weight: 600;
            transition: var(--transition);
        }

        .cart-btn:hover {
            background: var(--bg-rose-light);
        }

        .cart-badge {
            background-color: var(--primary-dark);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 10px;
        }

        /* بنر الواجهة (Hero Section) */
        .hero {
            padding: 60px 20px;
            text-align: center;
            background: white;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .hero h2 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 42px;
            color: var(--primary-dark);
            margin-bottom: 12px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 14px;
            max-width: 550px;
            margin: 0 auto 25px;
            line-height: 1.8;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-rose) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            font-family: 'Alexandria', sans-serif;
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        /* شبكة المنتجات */
        .container {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .section-title h3 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 32px;
            color: var(--primary-dark);
            margin-bottom: 25px;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image-wrap {
            width: 100%;
            height: 340px;
            overflow: hidden;
            background-color: var(--bg-rose-light);
        }

        .product-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-info h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .product-info .price {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 15px;
        }

        .add-to-cart-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-rose) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Alexandria', sans-serif;
        }

        .add-to-cart-btn:hover {
            opacity: 0.95;
        }

        /* سلة المشتريات المنزلقة */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
