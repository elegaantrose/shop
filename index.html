<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELGANT ROSE | الوردة الأنيقة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- استبدل مسار الشعار بالصورة الموجودة في مستودعك LOGO.JPE -->
            <img src="LOGO.JPE" alt="ELGANT ROSE Logo">
            <h1>ELGANT ROSE <span style="font-size: 14px; display: block; color: #777;">الوردة الأنيقة</span></h1>
        </div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="admin.html">لوحة المدير</a>
            <a href="#cart">السلة (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <div class="container">
        <h2>أحدث تشكيلة الملابس النسائية</h2>
        <div id="products-container" class="products-grid">
            <!-- سيتم تعبئة المنتجات تلقائياً هنا عبر JavaScript -->
        </div>

        <div class="cart-section" id="cart">
            <h3>سلة المشتريات</h3>
            <ul id="cart-items" style="list-style: none; padding: 0;">
                <p>السلة فارغة حالياً.</p>
            </ul>
            <hr>
            <h4>المجموع الكلي: <span id="total-price">0.00</span> د.أ</h4>
            <button onclick="checkout()">إتمام الطلب عبر واتساب</button>
        </div>
    </div>

    <script>
        // دالة تحويل رابط جوجل درايف العادي إلى رابط صورة مباشر تلقائياً
        function formatDriveImageUrl(inputUrl) {
            if (!inputUrl) return '';
            // إذا أدخل المدير الرابط كاملاً أو المعرف فقط
            let fileId = inputUrl.trim();
            if (inputUrl.includes('drive.google.com')) {
                const match = inputUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    fileId = match[1];
                }
            }
            // إرجاع الرابط المباشر المعالج لعرض الصورة بسلاسة
            return `https://lh3.googleusercontent.com/d/${fileId}`;
        }

        let cart = [];

        function loadProducts() {
            const container = document.getElementById('products-container');
            const products = JSON.parse(localStorage.getItem('elgant_products')) || [];

            if (products.length === 0) {
                container.innerHTML = '<p>لا توجد منتجات مضافة حالياً. يجوز للمدير إضافتها من لوحة التحكم.</p>';
                return;
            }

            container.innerHTML = '';
            products.forEach((product, index) => {
                const directImgUrl = formatDriveImageUrl(product.image);
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${directImgUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/250x300?text=خطأ+في+صورة+الدرايف'">
                    <h3>${product.name}</h3>
                    <div class="price">${product.price} دينار أردني</div>
                    <button onclick="addToCart('${product.name}', ${product.price})">أضف للسلة</button>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const totalPriceEl = document.getElementById('total-price');

            cartCount.innerText = cart.length;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p>السلة فارغة حالياً.</p>';
                totalPriceEl.innerText = '0.00';
                return;
            }

            cartItemsContainer.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartItemsContainer.innerHTML += `<li style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <span>${item.name} - <strong>${item.price} د.أ</strong></span>
                    <button style="background: #bc6c25; padding: 2px 8px; font-size: 12px;" onclick="removeFromCart(${index})">حذف</button>
                </li>`;
            });
            totalPriceEl.innerText = total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            let message = "مرحباً، أرغب بطلب المنتجات التالية من متجر الوردة الأنيقة (ELGANT ROSE):\n";
            let total = 0;
            cart.forEach(item => {
                message += `- ${item.name}: ${item.price} د.أ\n`;
                total += item.price;
            });
            message += `\nالمجموع الكلي: ${total.toFixed(2)} دينار أردني`;
            
            // رابط واتساب مباشر (ضع رقم هاتفك هنا بدلاً من الرقم التخيلي)
            let whatsappUrl = `https://wa.me/962700000000?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
